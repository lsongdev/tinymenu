; tinymenu on the YFROBOT Matrix:bit (classic ESP32, SSD1306 128x64 over I2C).
; The framebuffer is in the SSD1306's own page-major layout, so the pages that
; changed go straight to the panel; Adafruit_SSD1306 only initialises it.
[env:matrixbit]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit BusIO@1.17.1
    tinymenu=symlink://../..
    https://github.com/lsongdev/tinybutton.git#e733115232fa535daed50a9b701b01c90ed1690b
    tinymenu-demo=symlink://../demo
