; tinymenu on the original M5StickC (ST7735S 80x160, AXP192).
; The UI renders a 160x80 1-bit framebuffer; src/main.cpp pushes it to the LCD.
[env:m5stick-c]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/m5stack/M5StickC.git#0.2.9
    tinymenu=symlink://../..
    https://github.com/lsongdev/tinybutton.git#e733115232fa535daed50a9b701b01c90ed1690b
    tinymenu-demo=symlink://../demo
