; FoloToy AI Passport: ESP32-C3, 8 MB flash, ST7789P3 240x320, ADC ladder keys.
[env:folotoy]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    tinymenu=symlink://../..
    https://github.com/lsongdev/tinybutton.git#e733115232fa535daed50a9b701b01c90ed1690b
    tinymenu-demo=symlink://../demo
