; tinymenu on the XiaoMiao handheld (ESP32, ST7735 160x128 over SPI, D-pad + A/B).
; LovyanGFX drives the panel; the 1-bit framebuffer is expanded to RGB565 in
; 16-row strips that go out by DMA while the next strip is being converted.
[env:xiaomiao]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    tinymenu=symlink://../..
    https://github.com/lsongdev/tinybutton.git#e733115232fa535daed50a9b701b01c90ed1690b
    tinymenu-demo=symlink://../demo
