name: CI

on:
  push:
  pull_request:

jobs:
  host-test:
    name: Host test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Render and compare snapshots (ASan + UBSan)
        run: make -C test CC=${{ matrix.cc }}
      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.cc }}
          path: test/out

  platformio:
    name: PlatformIO (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [matrixbit, xiaomiao, m5stickc]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/platformio.ini', matrix.example)) }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d examples/${{ matrix.example }}

  esp-idf:
    name: ESP-IDF component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: test/idf

  arduino:
    name: Arduino library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
            - name: Adafruit SSD1306
          sketch-paths: |
            - examples/basic
